[project]
name = "proyectocompe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jhoaodidier", email = "neymardidierlopezgonzales@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=4.1.2",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=4.9.0.80",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.8.0",
    "pymavlink>=2.4.49",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "scipy>=1.12.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
proyectocompe = "proyectocompe:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

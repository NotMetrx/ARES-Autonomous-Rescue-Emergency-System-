model:
  name: dfine
  backbone: resnet50
  num_classes: 8
  pretrained: true
  freeze_backbone: false
training:
  epochs: 100
  batch_size: 8
  accumulate_grad_batches: 4
  precision: 16-mixed
  optimizer: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  lr_scheduler: cosine
  min_lr: 1.0e-6
  ema_decay: 0.9999
  gradient_clip_val: 1.0
  num_workers: 4
  pin_memory: true
  seed: 12345
  deterministic: true
checkpoint:
  monitor: EdgeScore
  mode: max
  save_top_k: 3
  save_last: true
  filename: "dfine_edge_{epoch:03d}_mAP{mAP50_95:.4f}_lat{Latency_CPU_ms:.2f}_edge{EdgeScore:.4f}"
edge:
  target_latency_cpu_ms: 30.0
  target_latency_e2e_ms: 50.0
  edge_score_alpha: 1.0
